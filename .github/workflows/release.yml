name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then sed -i '' "s/^VERSION=.*/VERSION=\"$VERSION\"/" build.sh; fi
          bash build.sh

      - name: Fixed-name copy for the download page
        run: cp build/Ice-D-day-*.zip build/Ice-D-day-mac.zip

      - name: Keep build result
        uses: actions/upload-artifact@v4
        with:
          name: Ice-D-day
          path: build/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          name: Ice D-day ${{ github.ref_name }}
          body: |
            ## 맥
            1. Ice-D-day-mac.zip 을 받아서 풀기
            2. Ice D-day 앱을 응용 프로그램 폴더로 옮기기
            3. 처음 열 때 경고가 뜨면: 시스템 설정 → 개인정보 보호 및 보안 맨 아래 그래도 열기
            (macOS 14 이상)

            ## 윈도우
            1. Ice-D-day-windows.zip 을 받아서 압축 풀기 (zip 안에서 바로 실행하지 말기)
            2. Ice D-day 폴더 안의 Ice D-day.exe 실행
            3. "Windows의 PC 보호" 창이 뜨면 추가 정보 → 실행
            (Windows 10·11, 64비트)

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Windows app
        run: |
          npm ci
          cd win
          npm ci
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then npm pkg set version="${GITHUB_REF_NAME#v}"; fi
          npm run dist
          cp dist/Ice-D-day-Windows-*.zip dist/Ice-D-day-windows.zip

      - name: Keep build result
        uses: actions/upload-artifact@v4
        with:
          name: Ice-D-day-Windows
          path: win/dist/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: win/dist/*.zip
